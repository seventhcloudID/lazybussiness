# Nginx (aaPanel) — reverse proxy ke Go di :8080
# Taruh di site config flowa.tigaawan.com (replace root/php handler)
#
# PENTING: tanpa timeout panjang, /api/ai/thumbnail & generate sering 504
# (OpenAI image / Gemini bisa 1–3 menit).

server {
    listen 80;
    listen 443 ssl http2;
    server_name flowa.tigaawan.com;

    # SSL dari aaPanel Let's Encrypt

    client_max_body_size 20m;

    # AI panjang (thumbnail ChatGPT, generate utas)
    location /api/ai/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
