<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalender — malesngonten</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="/css/app.css?v=mn83" id="app-css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="/js/tailwind-config.js"></script>
</head>
<body>
<nav id="sidebar"></nav>
<main>
  <header class="th-page-head">
    <div>
      <p class="th-eyebrow">Konten</p>
      <h1 class="th-title">Kalender</h1>
      <p class="th-lead">Jadwal Lazy + post manual dalam satu bulan.</p>
    </div>
    <div class="th-toolbar flex-wrap items-center gap-2">
      <button type="button" id="btn-prev" class="th-btn th-btn-ghost text-xs" title="Bulan lalu"><i class="bi bi-chevron-left"></i></button>
      <span class="th-chip mono" id="month-label">—</span>
      <button type="button" id="btn-next" class="th-btn th-btn-ghost text-xs" title="Bulan depan"><i class="bi bi-chevron-right"></i></button>
      <button type="button" id="btn-today" class="th-btn th-btn-soft text-xs">Hari ini</button>
      <a class="th-btn th-btn-ghost text-xs" href="/app/buat.html"><i class="bi bi-calendar-plus"></i> Jadwalkan</a>
      <button type="button" id="btn-refresh" class="th-btn th-btn-primary text-xs"><i class="bi bi-arrow-clockwise"></i></button>
    </div>
  </header>

  <div class="cal-legend mb-3">
    <span><i class="cal-dot cal-dot-lazy"></i> Lazy</span>
    <span><i class="cal-dot cal-dot-manual"></i> Manual</span>
    <span><i class="cal-dot cal-dot-done"></i> Selesai</span>
    <span><i class="cal-dot cal-dot-fail"></i> Gagal</span>
  </div>

  <section class="th-panel cal-panel">
    <div class="cal-weekdays" aria-hidden="true">
      <span>Sen</span><span>Sel</span><span>Rab</span><span>Kam</span><span>Jum</span><span>Sab</span><span>Min</span>
    </div>
    <div id="cal-grid" class="cal-grid" aria-busy="true"></div>
  </section>

  <section class="th-panel mt-4">
    <div class="th-panel-head">
      <span id="day-title">Pilih tanggal</span>
      <span class="text-xs text-muted" id="day-count"></span>
    </div>
    <div class="th-panel-body" id="day-list">
      <p class="text-sm text-muted m-0">Klik tanggal di kalender untuk lihat detail.</p>
    </div>
  </section>
</main>
<script src="/js/api.js?v=mn70"></script>
<script src="/js/layout.js?v=mn83"></script>
<script src="/js/pages/kalender.js?v=mn83"></script>
</body>
</html>
