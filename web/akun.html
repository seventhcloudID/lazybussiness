<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Akun — Threads Dashboard</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="/css/app.css?v=strand44" id="app-css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="/js/tailwind-config.js"></script>
</head>
<body>
<nav id="sidebar"></nav>
<main>
  <header class="th-page-head">
    <div>
      <p class="th-eyebrow">Sistem</p>
      <h1 class="th-title" id="akun-title">Workspace</h1>
      <p class="th-lead" id="akun-lead">Kelola akun Threads/IG dan ganti workspace aktif.</p>
    </div>
    <div class="flex flex-wrap gap-2 items-center" id="akun-head-actions">
      <button type="button" id="btn-add" class="th-btn th-btn-primary"><i class="bi bi-plus-lg"></i> Tambah akun</button>
      <button type="button" id="btn-keys-refresh" class="th-btn th-btn-ghost hidden"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
    </div>
  </header>

  <div class="akun-tabs" role="tablist" aria-label="Bagian akun">
    <button type="button" class="akun-tab is-active" role="tab" id="tab-workspace" data-tab="workspace" aria-selected="true" aria-controls="panel-workspace">
      <i class="bi bi-people"></i> Workspace
    </button>
    <button type="button" class="akun-tab" role="tab" id="tab-keys" data-tab="keys" aria-selected="false" aria-controls="panel-keys">
      <i class="bi bi-key"></i> API keys
    </button>
  </div>

  <div id="akun-alert" class="th-alert hidden mb-4"></div>

  <section id="panel-workspace" class="akun-panel" role="tabpanel" aria-labelledby="tab-workspace">
    <div id="akun-list" class="grid gap-3"></div>
  </section>

  <section id="panel-keys" class="akun-panel hidden" role="tabpanel" aria-labelledby="tab-keys" hidden>
    <p class="text-sm text-muted mb-4">Key di bawah ini global — dipakai semua workspace. Buffer key ada di tab Workspace → Kelola (per akun).</p>

    <section class="th-panel mb-4" id="gemini-panel">
      <div class="th-panel-head"><span>Gemini</span></div>
      <div class="th-panel-body" id="gemini-body">
        <p class="text-sm text-muted m-0">Memuat…</p>
      </div>
    </section>

    <section class="th-panel mb-4" id="openai-panel">
      <div class="th-panel-head"><span>OpenAI</span></div>
      <div class="th-panel-body" id="openai-body">
        <p class="text-sm text-muted m-0">Memuat…</p>
      </div>
    </section>
  </section>
</main>
<script src="/js/api.js?v=strand44"></script>
<script src="/js/layout.js?v=strand44"></script>
<script src="/js/pages/akun.js?v=strand44"></script>
</body>
</html>
