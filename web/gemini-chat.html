<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Gemini</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="/css/app.css?v=strand44" id="app-css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="/js/tailwind-config.js"></script>
</head>
<body>
<nav id="sidebar"></nav>
<main class="gchat-main">
  <header class="th-page-head gchat-head">
    <div>
      <p class="th-eyebrow">AI</p>
      <h1 class="th-title">Chat Gemini</h1>
      <p class="th-lead">Web UI chat biasa — tanpa instruksi tetap.</p>
    </div>
    <div class="th-toolbar flex flex-wrap items-center gap-2">
      <span id="chat-model-chip" class="th-chip font-mono text-xs">…</span>
      <label class="gchat-toggle" title="Google Search grounding">
        <input type="checkbox" id="use-search">
        <span>Search</span>
      </label>
      <button type="button" id="btn-clear-chat" class="th-btn th-btn-ghost text-xs">
        <i class="bi bi-trash"></i> Clear
      </button>
    </div>
  </header>

  <div id="chat-alert" class="th-alert hidden"></div>

  <section class="gchat-shell th-panel">
    <div id="chat-log" class="gchat-log" aria-live="polite"></div>
    <div id="chat-form" class="gchat-composer">
      <textarea id="chat-input" class="th-textarea gchat-input" rows="2" placeholder="Message…"></textarea>
      <button type="button" id="btn-send" class="th-btn th-btn-primary gchat-send">
        <i class="bi bi-send-fill"></i>
        <span>Send</span>
      </button>
    </div>
    <p id="chat-meta" class="gchat-meta text-[11px] text-muted"></p>
  </section>
</main>
<script src="/js/api.js?v=strand44"></script>
<script src="/js/layout.js?v=strand44"></script>
<script src="/js/pages/gemini-chat.js?v=strand25"></script>
</body>
</html>
