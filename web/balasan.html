<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Balasan — Threads Dashboard</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="/css/app.css?v=saas8">
<script src="https://cdn.tailwindcss.com"></script>
<script src="/js/tailwind-config.js"></script>
</head>
<body>
<nav id="sidebar"></nav>
<main>
  <header class="th-page-head !mb-3">
    <div>
      <p class="th-eyebrow">Konten</p>
      <h1 class="th-title">Balasan</h1>
      <p class="th-lead">Hanya starter utas. Conversation ringkas — tanpa rantai nested penuh.</p>
    </div>
    <div class="flex gap-2 flex-wrap items-center">
      <span id="inbox-summary" class="th-chip">Belum pilih post</span>
      <div class="th-preset">
        <button type="button" class="active">By post</button>
        <button type="button" disabled title="Segera">List</button>
      </div>
      <button id="btn-refresh-posts" class="th-btn th-btn-ghost" type="button" title="Muat ulang"><i class="bi bi-arrow-clockwise"></i></button>
    </div>
  </header>

  <div class="reply-inbox">
    <aside class="reply-inbox-posts">
      <div class="th-panel-head">
        <span>Posts</span>
        <span id="posts-count" class="text-xs font-medium text-muted"></span>
      </div>
      <div class="reply-post-search">
        <input id="post-search" class="th-input" type="search" placeholder="Cari post…">
      </div>
      <div id="posts-list" class="reply-post-list">
        <div class="th-empty py-10"><p class="text-sm text-muted">Memuat post…</p></div>
      </div>
    </aside>

    <section class="reply-inbox-thread">
      <div class="th-panel-head">
        <div class="min-w-0">
          <div id="thread-title" class="font-semibold truncate">Conversation</div>
          <div id="thread-sub" class="text-xs text-muted font-medium mt-0.5">Pilih post di kiri</div>
        </div>
        <div class="th-preset" id="reply-filter">
          <button type="button" data-filter="all" class="active">All</button>
          <button type="button" data-filter="pending">Belum</button>
          <button type="button" data-filter="answered">Sudah</button>
        </div>
      </div>

      <div id="thread-empty" class="th-empty py-16">
        <div class="th-empty-icon"><i class="bi bi-chat-dots"></i></div>
        <p class="font-semibold text-ink mb-1">Pilih post</p>
        <p class="text-sm text-muted">Thread balasan akan muncul di sini, termasuk nested reply.</p>
      </div>

      <div id="thread-body" class="hidden flex flex-col min-h-0 flex-1">
        <div id="selected-post"></div>
        <div id="replies-list" class="ri-thread"></div>
      </div>
    </section>
  </div>
</main>
<script src="/js/api.js?v=saas8"></script>
<script src="/js/layout.js?v=saas8"></script>
<script src="/js/pages/balasan.js?v=saas8"></script>
</body>
</html>
