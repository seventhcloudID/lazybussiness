<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lazy Business — Dashboard</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="/css/app.css?v=saas29">
<script src="https://cdn.tailwindcss.com"></script>
<script src="/js/tailwind-config.js"></script>
</head>
<body>
<nav id="sidebar"></nav>
<main>
  <header class="th-page-head">
    <div>
      <p class="th-eyebrow">Automasi</p>
      <h1 class="th-title">Lazy Business</h1>
      <p class="th-lead">24/7: AI pilih jam terbaik, generate utas → Threads + carousel IG. Server harus tetap jalan.</p>
    </div>
    <div class="th-toolbar">
      <button id="btn-run-now" class="th-btn th-btn-soft" type="button">
        <i class="bi bi-play-fill"></i> Run 1 sekarang
      </button>
      <button id="btn-refresh" class="th-btn th-btn-ghost" type="button">
        <i class="bi bi-arrow-clockwise"></i>
      </button>
    </div>
  </header>

  <div id="lazy-alert" class="th-alert hidden"></div>
  <div id="lazy-warnings" class="lazy-warns mb-4 hidden"></div>

  <div class="th-panel mb-4">
    <div class="th-panel-body grid grid-cols-1 md:grid-cols-4 gap-3 items-end">
      <div>
        <label class="th-label" for="enabled">Otomasi</label>
        <label class="lazy-toggle">
          <input type="checkbox" id="enabled">
          <span id="enabled-label">OFF</span>
        </label>
      </div>
      <div>
        <label class="th-label" for="posts-per-day">Konten / hari (min 5)</label>
        <input id="posts-per-day" class="th-input" type="number" min="5" max="12" value="5">
      </div>
      <div>
        <label class="th-label" for="brand">Brand (@handle)</label>
        <input id="brand" class="th-input" placeholder="bimosept">
      </div>
      <div>
        <label class="th-label" for="topic">Topik hint (opsional)</label>
        <input id="topic" class="th-input" placeholder="Kosong = dari niche">
      </div>
    </div>
    <div class="th-panel-body pt-0 flex flex-wrap gap-2">
      <button type="button" id="btn-save" class="th-btn th-btn-primary text-sm">
        <i class="bi bi-check2"></i> Simpan pengaturan
      </button>
      <span id="lazy-meta" class="text-xs text-muted self-center"></span>
    </div>
  </div>

  <div class="lazy-stats mb-4" id="lazy-stats">
    <div class="lazy-stat">
      <span class="lazy-stat-k">Hari ini</span>
      <strong id="stat-today">—</strong>
    </div>
    <div class="lazy-stat">
      <span class="lazy-stat-k">Selesai</span>
      <strong id="stat-done">0</strong>
    </div>
    <div class="lazy-stat">
      <span class="lazy-stat-k">Antri</span>
      <strong id="stat-pending">0</strong>
    </div>
    <div class="lazy-stat">
      <span class="lazy-stat-k">Gagal / skip IG</span>
      <strong id="stat-fail">0</strong>
    </div>
  </div>

  <div class="th-panel mb-6">
    <div class="th-panel-head flex items-center justify-between">
      <span>Antrian hari ini</span>
      <span id="next-hint" class="text-xs text-muted font-medium"></span>
    </div>
    <div class="th-panel-body p-0">
      <div id="job-list" class="lazy-jobs">
        <p class="text-sm text-muted p-4 m-0">Belum ada rencana — nyalakan otomasi lalu simpan.</p>
      </div>
    </div>
  </div>

  <div id="lazy-last" class="th-panel mb-6 hidden">
    <div class="th-panel-head">Hasil terakhir (run sekarang)</div>
    <div class="th-panel-body">
      <h3 id="lazy-title" class="text-base font-bold m-0 mb-2"></h3>
      <div id="lazy-parts" class="gen-thread"></div>
      <p id="lazy-caption" class="text-sm whitespace-pre-wrap mt-3 mb-0 text-muted"></p>
    </div>
  </div>
</main>
<script src="/js/api.js?v=saas29"></script>
<script src="/js/layout.js?v=saas29"></script>
<script src="/js/pages/lazy.js?v=saas29"></script>
</body>
</html>
