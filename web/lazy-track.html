<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lazy Track — Dashboard</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="/css/app.css?v=strand56" id="app-css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="/js/tailwind-config.js"></script>
</head>
<body>
<nav id="sidebar"></nav>
<main class="ltrk-page">
  <header class="th-page-head">
    <div>
      <p class="th-eyebrow">Automasi</p>
      <h1 class="th-title">Lazy Track</h1>
      <p class="th-lead">Capaian post dari Lazy Business saja — 30 hari terakhir.</p>
    </div>
    <div class="th-toolbar">
      <a href="/lazy.html" class="th-btn th-btn-ghost"><i class="bi bi-lightning"></i> Lazy Business</a>
      <button type="button" id="btn-refresh" class="th-btn th-btn-soft">
        <i class="bi bi-arrow-clockwise"></i> Refresh
      </button>
    </div>
  </header>

  <div id="ltrk-alert" class="th-alert hidden mb-4"></div>

  <div class="ltrk-meta mb-3">
    <span id="ltrk-range">Memuat…</span>
    <div class="ltrk-filters" role="tablist">
      <button type="button" class="ltrk-filter is-on" data-filter="all">Semua</button>
      <button type="button" class="ltrk-filter" data-filter="done">Selesai</button>
      <button type="button" class="ltrk-filter" data-filter="skipped_ig">IG skip</button>
      <button type="button" class="ltrk-filter" data-filter="failed">Gagal</button>
    </div>
  </div>

  <div class="ltrk-kpis mb-4" id="ltrk-kpis">
    <div class="ltrk-kpi"><span class="ltrk-kpi-k">Post Lazy</span><strong id="k-total">—</strong></div>
    <div class="ltrk-kpi"><span class="ltrk-kpi-k">Selesai</span><strong id="k-done">—</strong></div>
    <div class="ltrk-kpi"><span class="ltrk-kpi-k">Views</span><strong id="k-views">—</strong></div>
    <div class="ltrk-kpi"><span class="ltrk-kpi-k">Likes</span><strong id="k-likes">—</strong></div>
    <div class="ltrk-kpi"><span class="ltrk-kpi-k">Engagement</span><strong id="k-eng">—</strong></div>
    <div class="ltrk-kpi"><span class="ltrk-kpi-k">Channel</span><strong id="k-ch" class="ltrk-kpi-ch">—</strong></div>
  </div>

  <section class="th-panel">
    <div class="th-panel-head">
      <span>Hasil Lazy Business</span>
      <span id="ltrk-count" class="text-xs text-muted font-medium">0 post</span>
    </div>
    <div class="th-panel-body p-0">
      <div id="ltrk-list" class="ltrk-list">
        <p class="lazy-empty">Memuat capaian…</p>
      </div>
    </div>
  </section>
</main>
<script src="/js/api.js?v=strand44"></script>
<script src="/js/layout.js?v=strand56"></script>
<script src="/js/pages/lazy-track.js?v=strand56"></script>
</body>
</html>
