<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login — Malesngonten</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="/css/app.css?v=mn73" id="app-css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="/js/tailwind-config.js"></script>
</head>
<body class="login-body">
  <main class="login-wrap">
    <div class="login-card th-panel">
      <div class="th-panel-body" style="padding:28px 26px">
        <a class="login-brand" href="/">
          <span class="dot" aria-hidden="true"></span>
          malesngonten
        </a>
        <p class="th-eyebrow m-0 mb-1">dashboard</p>
        <h1 class="th-title text-2xl m-0 mb-1">Masuk</h1>
        <p class="th-lead m-0 mb-5">Kelola utas, carousel, Lazy, dan insight dari satu workspace.</p>
        <div id="login-alert" class="th-alert hidden mb-3"></div>
        <form id="login-form" class="space-y-3">
          <div>
            <label class="th-label" for="user">Username</label>
            <input id="user" class="th-input" autocomplete="username" required>
          </div>
          <div>
            <label class="th-label" for="pass">Password</label>
            <input id="pass" type="password" class="th-input" autocomplete="current-password" required>
          </div>
          <button type="submit" class="th-btn th-btn-primary w-full justify-center" id="btn-login" style="margin-top:8px;padding:11px 16px">
            <i class="bi bi-box-arrow-in-right"></i> Login
          </button>
        </form>
        <p class="text-xs text-muted mt-5 mb-0">Operator: <a href="/core/login.html" class="underline">/core</a></p>
      </div>
    </div>
  </main>
<script src="/js/api.js?v=mn70"></script>
<script>
function defaultHome(role) {
  return role === 'admin' ? '/core/' : '/app/ringkasan.html';
}
function safeNext(role) {
  const next = new URLSearchParams(location.search).get('next');
  if (!next || !next.startsWith('/') || next.startsWith('//')) return defaultHome(role);
  if (role === 'admin') return next;
  if (next.startsWith('/core')) return '/app/ringkasan.html';
  if (next.startsWith('/app/')) return next;
  if (next.endsWith('.html')) return '/app' + (next.startsWith('/') ? next : '/' + next);
  return defaultHome(role);
}

(async () => {
  try {
    const me = await Threads.api('/api/auth/me');
    if (me?.authenticated) {
      location.replace(safeNext(me.role || 'tenant'));
    }
  } catch {}
})();

document.getElementById('login-form').onsubmit = async (e) => {
  e.preventDefault();
  const alert = document.getElementById('login-alert');
  const btn = document.getElementById('btn-login');
  alert.classList.add('hidden');
  btn.disabled = true;
  try {
    const res = await Threads.api('/api/auth/login', {
      method: 'POST',
      body: JSON.stringify({
        username: document.getElementById('user').value.trim(),
        password: document.getElementById('pass').value,
      }),
    });
    location.replace(safeNext(res.role || 'tenant'));
  } catch (err) {
    alert.textContent = err.message || 'Login gagal';
    alert.classList.remove('hidden');
    btn.disabled = false;
  }
};
</script>
</body>
</html>
