<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kuota — Threads Dashboard</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="/css/app.css?v=strand1">
<script src="https://cdn.tailwindcss.com"></script>
<script src="/js/tailwind-config.js"></script>
</head>
<body>
<nav id="sidebar"></nav>
<main>
  <header class="th-page-head">
    <div>
      <p class="th-eyebrow">Analitik</p>
      <h1 class="th-title">Kuota</h1>
      <p class="th-lead">Batas publish Threads + estimasi kuota Gemini free tier.</p>
    </div>
  </header>

  <div class="th-panel mb-5">
    <div class="th-panel-head">Threads API</div>
    <div class="th-panel-body">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <div>
          <div class="text-sm font-semibold mb-2">Post (24 jam)</div>
          <div class="flex justify-between text-sm mb-2">
            <span>Terpakai: <b id="quota-usage">—</b></span>
            <span class="text-muted">Batas: <span id="quota-limit">—</span></span>
          </div>
          <div class="th-progress"><span id="quota-bar"></span></div>
        </div>
        <div>
          <div class="text-sm font-semibold mb-2">Balasan (24 jam)</div>
          <div class="flex justify-between text-sm mb-2">
            <span>Terpakai: <b id="reply-usage">—</b></span>
            <span class="text-muted">Batas: <span id="reply-limit">—</span></span>
          </div>
          <div class="th-progress"><span id="reply-bar"></span></div>
        </div>
      </div>
    </div>
  </div>

  <div class="th-panel">
    <div class="th-panel-head">
      <span>Gemini free tier</span>
      <span id="ai-quota-tier" class="text-xs text-muted font-medium"></span>
    </div>
    <div class="th-panel-body">
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div>
          <div class="flex justify-between text-sm mb-1.5">
            <span>RPD (hari)</span>
            <span class="text-muted"><b id="q-rpd-used">—</b> / <span id="q-rpd-limit">—</span></span>
          </div>
          <div class="th-progress"><span id="q-rpd-bar"></span></div>
        </div>
        <div>
          <div class="flex justify-between text-sm mb-1.5">
            <span>RPM (menit)</span>
            <span class="text-muted"><b id="q-rpm-used">—</b> / <span id="q-rpm-limit">—</span></span>
          </div>
          <div class="th-progress"><span id="q-rpm-bar"></span></div>
        </div>
        <div>
          <div class="flex justify-between text-sm mb-1.5">
            <span>TPM (token/menit)</span>
            <span class="text-muted"><b id="q-tpm-used">—</b> / <span id="q-tpm-limit">—</span></span>
          </div>
          <div class="th-progress"><span id="q-tpm-bar"></span></div>
        </div>
      </div>
      <p id="ai-quota-note" class="text-xs text-muted mt-3 mb-0"></p>
    </div>
  </div>
</main>
<script src="/js/api.js?v=strand1"></script>
<script src="/js/layout.js?v=strand1"></script>
<script src="/js/pages/kuota.js?v=saas8"></script>
</body>
</html>
