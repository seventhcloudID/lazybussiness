<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IG Posts — Dashboard</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="/css/app.css?v=strand1">
<script src="https://cdn.tailwindcss.com"></script>
<script src="/js/tailwind-config.js"></script>
</head>
<body>
<nav id="sidebar"></nav>
<main>
  <header class="th-page-head">
    <div>
      <p class="th-eyebrow">Instagram</p>
      <h1 class="th-title">IG Posts</h1>
      <p class="th-lead">Media terbaru dari akun Instagram yang terhubung.</p>
    </div>
    <p id="posts-meta" class="text-sm text-muted"></p>
  </header>

  <div id="ig-empty" class="th-panel hidden">
    <div class="th-empty">
      <div class="th-empty-icon"><i class="bi bi-instagram"></i></div>
      <p class="font-semibold text-ink mb-1">Belum ada token Instagram</p>
      <p class="text-sm text-muted mb-5">Hubungkan token IG dulu sebelum melihat media.</p>
      <a href="/ig-token.html" class="th-btn th-btn-primary">Buka IG Token</a>
    </div>
  </div>

  <div id="posts-list" class="grid gap-4 sm:grid-cols-2 xl:grid-cols-3"></div>
</main>
<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/pages/ig-posts.js"></script>
</body>
</html>
