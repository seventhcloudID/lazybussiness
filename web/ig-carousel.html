<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IG Carousel — Dashboard</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="/css/app.css?v=saas32">
<script src="https://cdn.tailwindcss.com"></script>
<script src="/js/tailwind-config.js"></script>
</head>
<body>
<nav id="sidebar"></nav>
<main>
  <header class="th-page-head">
    <div>
      <p class="th-eyebrow">Instagram</p>
      <h1 class="th-title">Carousel dari Utas</h1>
      <p class="th-lead">Satu bagian utas = satu slide. Edit, preview, lalu salin atau publish.</p>
    </div>
    <div class="th-toolbar">
      <a href="/lazy.html" class="th-btn th-btn-ghost"><i class="bi bi-lightning"></i> Lazy Business</a>
      <a href="/generate.html" class="th-btn th-btn-soft"><i class="bi bi-magic"></i> Generate Utas</a>
    </div>
  </header>

  <div id="ig-alert" class="th-alert hidden"></div>

  <section class="igc-brief th-panel mb-4">
    <div class="th-panel-body">
      <div class="igc-brief-grid igc-brief-brand">
        <div class="igc-brief-field">
          <label class="th-label" for="brand">Nama brand</label>
          <div class="flex gap-2">
            <input id="brand" class="th-input" placeholder="bimosept">
            <button type="button" id="btn-save-brand" class="th-btn th-btn-soft shrink-0">Simpan</button>
          </div>
        </div>
        <div class="igc-brief-field">
          <label class="th-label" for="topic">Topik (opsional)</label>
          <input id="topic" class="th-input" placeholder="Kalau generate utas baru dari sini">
        </div>
      </div>
    </div>
  </section>

  <div class="igc-film-wrap mb-4">
    <div class="igc-film-head">
      <span id="film-label" class="text-sm font-semibold text-ink">0 slide</span>
      <div class="flex gap-2">
        <button type="button" id="btn-from-utas" class="th-btn th-btn-ghost text-xs">
          <i class="bi bi-box-arrow-in-down"></i> Ambil utas tersimpan
        </button>
        <button type="button" id="btn-add-slide" class="th-btn th-btn-ghost text-xs">
          <i class="bi bi-plus-lg"></i> Tambah
        </button>
        <button type="button" id="btn-gen" class="th-btn th-btn-primary text-xs">
          <i class="bi bi-magic"></i> Generate utas → carousel
        </button>
      </div>
    </div>
    <div id="filmstrip" class="igc-filmstrip" tabindex="0"></div>
  </div>

  <div class="igc-workspace mb-5">
    <div class="igc-editor th-panel">
      <div class="th-panel-head flex items-center justify-between gap-2">
        <span id="editor-title">Edit slide 1</span>
        <button type="button" id="btn-remove-slide" class="th-btn th-btn-ghost text-xs text-danger">
          <i class="bi bi-trash"></i> Hapus
        </button>
      </div>
      <div class="th-panel-body space-y-3">
        <div>
          <div class="flex justify-between items-baseline mb-1">
            <label class="th-label m-0" for="f-text">Isi slide (= bagian utas)</label>
            <span id="text-count" class="text-[11px] text-muted">0/500</span>
          </div>
          <textarea id="f-text" class="th-textarea" rows="8" maxlength="500" placeholder="Teks utas bagian ini…"></textarea>
        </div>
        <div>
          <label class="th-label" for="f-image">URL gambar (publish IG)</label>
          <input id="f-image" class="th-input" placeholder="https://…/slide.jpg">
        </div>
      </div>
    </div>

    <aside class="igc-preview-col">
      <div class="igc-preview-sticky th-panel">
        <div class="th-panel-head flex items-center justify-between">
          <span>Preview</span>
          <div class="igc-nav-btns">
            <button type="button" id="btn-prev" class="th-btn th-btn-ghost !py-1 !px-2"><i class="bi bi-chevron-left"></i></button>
            <button type="button" id="btn-next" class="th-btn th-btn-ghost !py-1 !px-2"><i class="bi bi-chevron-right"></i></button>
          </div>
        </div>
        <div class="th-panel-body">
          <div class="igc-stage">
            <div id="preview-card" class="igc-card">
              <div class="igc-card-glow"></div>
              <div class="igc-card-top">
                <p id="preview-handle" class="igc-handle" hidden></p>
                <hr id="preview-divider" class="igc-divider" hidden>
              </div>
              <div class="igc-card-inner">
                <p id="preview-text" class="igc-slide-text">Isi slide muncul di sini.</p>
              </div>
              <div class="igc-card-foot">
                <div class="igc-dots" id="preview-dots"></div>
                <span id="preview-meta" class="igc-meta">1 / 6</span>
              </div>
            </div>
          </div>
          <p id="consideration" class="igc-consideration"></p>
          <p id="fit-warn" class="igc-fit-warn" hidden></p>
          <div class="igc-actions">
            <button type="button" id="btn-to-threads" class="th-btn th-btn-soft w-full justify-center text-sm">
              <i class="bi bi-send"></i> Ke Buat Post (Threads)
            </button>
            <button type="button" id="btn-copy-slides" class="th-btn th-btn-ghost w-full justify-center text-sm">
              <i class="bi bi-files"></i> Salin teks slide
            </button>
            <button type="button" id="btn-copy-caption" class="th-btn th-btn-ghost w-full justify-center text-sm">
              <i class="bi bi-clipboard"></i> Salin caption
            </button>
            <button type="button" id="btn-publish" class="th-btn th-btn-primary w-full justify-center text-sm">
              <i class="bi bi-instagram"></i> Publish ke IG
            </button>
          </div>
        </div>
      </div>
    </aside>
  </div>

  <div class="th-panel mb-6">
    <div class="th-panel-head flex items-center justify-between">
      <span>Caption IG</span>
      <span id="caption-count" class="text-xs text-muted font-medium">0/2200</span>
    </div>
    <div class="th-panel-body">
      <textarea id="caption" class="th-textarea" rows="4" maxlength="2200" placeholder="Caption post carousel…"></textarea>
      <p class="text-[11px] text-muted mt-2 mb-0">Publish butuh URL gambar publik di minimal 2 slide.</p>
      <div id="publish-status" class="igc-status mt-3">Belum publish.</div>
    </div>
  </div>
</main>
<script src="/js/api.js?v=saas32"></script>
<script src="/js/layout.js?v=saas32"></script>
<script src="/js/pages/ig-carousel.js?v=saas32"></script>
</body>
</html>
